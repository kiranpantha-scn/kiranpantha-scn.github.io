<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Downloads</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body class="bg-light py-5">

<div class="container">
    <h2 class="mb-4 text-center">Available PDF Downloads</h2>

    <table class="table table-bordered table-hover align-middle bg-white">
        <thead class="table-primary">
            <tr>
                <th style="width: 50px;">#</th>
                <th>File Name</th>
                <th style="width: 120px;">Download</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td><i class="fa-solid fa-file-pdf text-danger me-2"></i>Test PDF 1</td>
                <td><a class="btn btn-sm btn-outline-primary" href="/pdfs/test-pdf-1.pdf" download>
                    <i class="fa-solid fa-download me-1"></i>Download</a></td>
            </tr>
            <tr>
                <td>2</td>
                <td><i class="fa-solid fa-file-pdf text-danger me-2"></i>Test PDF 2</td>
                <td><a class="btn btn-sm btn-outline-primary" href="/pdfs/test-pdf-2.pdf" download>
                    <i class="fa-solid fa-download me-1"></i>Download</a></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
